<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#050b16"><title>NEXA — Local AI</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#050b16;color:#eef5ff}body{background:radial-gradient(circle at 50% -10%,#123d70 0,#07111f 35%,#03070d 75%)}.app{max-width:900px;margin:auto;min-height:100vh;display:flex;flex-direction:column}header{position:sticky;top:0;z-index:5;padding:16px 18px;background:#050b16dd;backdrop-filter:blur(16px);border-bottom:1px solid #19304a;display:flex;align-items:center;justify-content:space-between}.logo{font-weight:900;letter-spacing:2px}.status{font-size:12px;color:#7e9bb8}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff5c70;margin-right:6px}.ok{background:#45e09b}#chat{flex:1;padding:22px 15px 130px}.msg{display:flex;margin:12px 0}.msg.user{justify-content:flex-end}.bubble{max-width:82%;padding:12px 14px;border-radius:18px;border:1px solid #1d3955;line-height:1.5;white-space:pre-wrap;box-shadow:0 8px 30px #0004}.assistant .bubble{background:#0b1726}.user .bubble{background:#124d87;border-color:#1c70b9}.welcome{text-align:center;padding:55px 18px;color:#91aac2}.welcome h1{color:#fff;margin-bottom:8px}.welcome p{margin:0}.composer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(900px,100%);padding:12px 14px 18px;background:linear-gradient(transparent,#03070dee 20%);z-index:6}.box{display:flex;gap:8px;background:#081321;border:1px solid #21405e;border-radius:22px;padding:8px}textarea{flex:1;resize:none;min-height:45px;max-height:120px;background:transparent;border:0;outline:0;color:#fff;padding:11px;font:inherit}button{border:0;border-radius:16px;background:#1265ad;color:#fff;font-weight:800;padding:0 15px;min-width:48px;cursor:pointer}button:active{transform:scale(.96)}button.secondary{background:#10263d}.mic.recording{background:#d33c58;animation:pulse 1s infinite}.tools{display:flex;justify-content:space-between;padding:7px 4px 0;font-size:11px;color:#63809b}.tools button{padding:5px 8px;min-width:auto;background:transparent;color:#7292ad}@keyframes pulse{50%{box-shadow:0 0 0 8px #d33c5822}}</style></head><body><div class="app"><header><div class="logo">NEXA</div><div class="status"><span id="dot" class="dot"></span><span id="status">Menghubungkan...</span></div></header><main id="chat"><div class="welcome" id="welcome"><h1>Local AI</h1><p>Chat, bicara, dan dengarkan jawaban AI lokal.</p></div></main><div class="composer"><div class="box"><button class="secondary mic" id="mic" title="Bicara">●</button><textarea id="input" placeholder="Tulis atau tekan mic..." rows="1"></textarea><button id="send">➤</button></div><div class="tools"><span id="model">Model: -</span><button id="clear">Hapus percakapan</button></div></div></div><script>const chat=document.getElementById('chat'),input=document.getElementById('input'),send=document.getElementById('send'),mic=document.getElementById('mic'),statusEl=document.getElementById('status'),dot=document.getElementById('dot'),modelEl=document.getElementById('model');let history=JSON.parse(localStorage.getItem('nexa_history')||'[]'),recording=false,mediaRecorder,chunks=[];function add(role,text){document.getElementById('welcome')?.remove();let r=document.createElement('div');r.className='msg '+role;let b=document.createElement('div');b.className='bubble';b.textContent=text;r.appendChild(b);chat.appendChild(r);chat.scrollTop=chat.scrollHeight}function save(){localStorage.setItem('nexa_history',JSON.stringify(history.slice(-40)))}function render(){history.forEach(x=>add(x.role==='user'?'user':'assistant',x.content))}async function status(){try{let r=await fetch('/api/status'),d=await r.json();statusEl.textContent=d.ok?'Lokal aktif':'Ollama belum aktif';if(d.ok)dot.classList.add('ok');modelEl.textContent='Model: '+d.model}catch(e){statusEl.textContent='Server offline'}}async function ask(text){text=text.trim();if(!text)return;add('user',text);history.push({role:'user',content:text});save();input.value='';let r=document.createElement('div');r.className='msg assistant';let b=document.createElement('div');b.className='bubble';b.textContent='Berpikir...';r.appendChild(b);chat.appendChild(r);chat.scrollTop=chat.scrollHeight;try{let x=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,history:history.slice(-20,-1)})}),d=await x.json();if(!x.ok)throw Error(d.error||'Gagal');b.textContent=d.answer;history.push({role:'assistant',content:d.answer});save();speak(d.answer)}catch(e){b.textContent='Error: '+e.message}}send.onclick=()=>ask(input.value);input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask(input.value)}});document.getElementById('clear').onclick=()=>{history=[];save();chat.innerHTML='<div class="welcome" id="welcome"><h1>Local AI</h1><p>Percakapan baru.</p></div>'};async function speak(text){try{let r=await fetch('/api/speak',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});if(r.ok){let a=new Audio(URL.createObjectURL(await r.blob()));a.play().catch(()=>{})}}catch(e){}}mic.onclick=async()=>{if(recording){mediaRecorder.stop();return}try{let stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];mediaRecorder=new MediaRecorder(stream);recording=true;mic.classList.add('recording');mediaRecorder.ondataavailable=e=>chunks.push(e.data);mediaRecorder.onstop=async()=>{recording=false;mic.classList.remove('recording');stream.getTracks().forEach(t=>t.stop());let fd=new FormData();fd.append('audio',new Blob(chunks,{type:'audio/webm'}),'voice.webm');try{let r=await fetch('/api/transcribe',{method:'POST',body:fd}),d=await r.json();if(d.text)ask(d.text);else alert(d.error||'Suara tidak terbaca')}catch(e){alert('STT error: '+e.message)}};mediaRecorder.start()}catch(e){alert('Mic tidak bisa digunakan: '+e.message)}};render();status();</script></body></html>
